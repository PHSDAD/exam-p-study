<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">免賠、共保與封頂的支付函數</title><desc id="desc">損失低於 100 時支付零，100 到 500 之間按斜率 0.8 上升，到損失 500 時達到最高支付 320，之後保持不變。</desc><rect width="760" height="290" rx="12" fill="#f3f8f6"/><g font-family="Microsoft YaHei,sans-serif" fill="#173338"><text x="32" y="32" font-size="16" font-weight="bold">Y = 0.8 min((X - 100)⁺, 400)</text><path d="M76 230H714M76 230V55" stroke="#667d79" stroke-width="1.5"/><path d="M76 230H166L526 83H700" stroke="#007c78" fill="none" stroke-width="4"/><path d="M166 230V70M526 230V83M76 83H526" stroke="#b6ccc5" stroke-width="1.2" stroke-dasharray="5 5"/><circle cx="166" cy="230" r="4" fill="#007c78"/><circle cx="526" cy="83" r="4" fill="#007c78"/><text x="58" y="253" font-size="13">0</text><text x="148" y="253" font-size="13">100</text><text x="512" y="253" font-size="13">500</text><text x="39" y="88" font-size="13">320</text><text x="635" y="270" font-size="13">原始損失 X</text><text x="13" y="55" font-size="13">賠款 Y</text><text x="105" y="211" font-size="13">免賠區</text><text x="305" y="133" font-size="13" transform="rotate(-24 305 133)">斜率 = 0.8</text><text x="559" y="70" font-size="13">最終支付上限 320</text><text x="100" y="280" font-size="12" fill="#52686b">共保前上限 400；轉折損失 = 100 + 400 = 500</text></g></svg>
